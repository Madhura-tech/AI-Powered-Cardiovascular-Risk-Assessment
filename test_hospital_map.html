<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Map Test</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 50%, #fbcfe8 100%);
        }
        .map-container {
            width: 100%;
            height: 400px;
            border: 2px solid rgba(236, 72, 153, 0.2);
            border-radius: 15px;
            overflow: hidden;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .test-button {
            background: linear-gradient(135deg, #ec4899, #be185d);
            border: none;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px;
        }
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
        }
    </style>
</head>
<body>
    <h1 style="color: #831843;">Hospital Map Test</h1>
    
    <button class="test-button" onclick="loadHospitalMap()">
        <i class="fas fa-map-marker-alt"></i> Load Map
    </button>
    
    <button class="test-button" onclick="openFullMap()">
        <i class="fas fa-expand"></i> Open Full Map
    </button>
    
    <div id="hospitalMap" class="map-container">
        <div style="text-align: center; color: #831843;">
            <i class="fas fa-map" style="font-size: 3rem; color: #ec4899; margin-bottom: 1rem;"></i>
            <p>Click "Load Map" to display the interactive hospital map</p>
        </div>
    </div>

    <script src="js/map-fix.js"></script>
    <script>
        console.log('Test page loaded');
        console.log('loadHospitalMap function available:', typeof loadHospitalMap);
        console.log('openFullMap function available:', typeof openFullMap);
    </script>
</body>
</html>
